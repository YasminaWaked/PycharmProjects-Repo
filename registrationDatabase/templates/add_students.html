<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Summer Camp</title>
        <link rel="stylesheet" href="https://codepen.io/gymratpacks/pen/VKzBEp#0">
        <link href='https://fonts.googleapis.com/css?family=Nunito:400,300' rel='stylesheet' type='text/css'>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
      <div class="row">
    <div class="col-md-12">
      <form action="/" method="post">
        <div class="row">
        <h1> Summer Camp Registration Form </h1>
        <fieldset>
          <legend><span class="number">1</span> Personal Information</legend>
          <label for="Name">Name:</label>
          <input type="text" id="name" name="name" required>
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" placeholder="" required>
            <label for="age">Age:</label>
          <input type="number" id="age" name="age" required>
            <label>Gender:</label>
          <input type="radio" id="male" value="M" name="gender"><label for="male" class="light">Male</label><br>
          <input type="radio" id="female" value="F" name="gender"><label for="female" class="light">Female</label>
        </fieldset>
            <fieldset>

          <legend><span class="number">2</span> Your Profile</legend>
                <label for="school">School:</label>
                <input type="text" id="school" name="school">

         <label for="bio">Bio:</label>
          <textarea id="bio" name="bio"></textarea>



         <label for="interest">Interest:</label>
          <select id="interest" name="interest">
              <option value="frontend_developer">Front-End Developer</option>
              <option value="php_developer">PHP Developer</option>
              <option value="python_developer">Python Developer</option>
              <option value="web_designer">Web Designer</option>
              <option value="wordpress_developer">Wordpress Developer</option>
              <option value="game_developer">Game Developer</option>
          </select>

          <label for="week">Choose a week:</label>
          <select id="week" name="week">
              <option value="Week 1">Week 1</option>
              <option value="Week 2">Week 2</option>
              <option value="Week 3">Week 3</option>
              <option value="Week 4">Week 4</option>
          </select>
         </fieldset>

        <button type="submit">Register</button>
               </div>
      </form>
     </div>
      </div>
    </body>
</html>
