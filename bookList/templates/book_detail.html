<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }}</title>
</head>
<body>
    <h1>{{ book.title }}</h1>
    <p><strong>Author: </strong> {{ book.author }}</p>
    <p><strong>Year: </strong> {{ book.year }}</p>
    <p><strong>Description: </strong> {{ book.description }}</p>
    {% if book.year < 1950 %}
        <p>This book is considered a classic</p>
    {% else %}
        <p>This book is not considered a classic</p>
    {% endif %}
    <a href="/"> Back to Book List </a>
</body>
</html>
